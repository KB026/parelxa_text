<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #09090B; color: #fff; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
    .logo { font-size: 32px; font-weight: bold; background: linear-gradient(135deg, #06B6D4, #3B82F6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .message-box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin: 20px 0; border-left: 3px solid #38bdf8; }
    .button { display: inline-block; background: #38bdf8; color: #09090B; padding: 12px 24px; border-radius: 8px; text-decoration: none; margin: 15px 0; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div style="text-align: center; margin-bottom: 30px;">
      <div class="logo">PARLEXA</div>
    </div>
    <h2>New Message from Parlexa Team</h2>
    <div class="message-box">
      <p><strong>From:</strong> Parlexa Support</p>
      <p><strong>About:</strong> {{TOOL_NAME}}</p>
      <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.1);">
      <p>{{MESSAGE}}</p>
    </div>
    <p>Please reply to this message in your vendor dashboard to continue the conversation.</p>
    <center><a href="https://parlexa.in/dashboard/vendor/messages" class="button">View Inbox</a></center>
    <div style="text-align: center; color: #999; font-size: 12px; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
      <p>&copy; 2026 Parlexa. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
